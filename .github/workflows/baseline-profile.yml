name: Generate Baseline Profile

# 手动触发：在 GitHub 仓库 Actions 页选择 "Generate Baseline Profile" → Run workflow。
on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: android

jobs:
  generate-baseline-profile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: chmod gradlew
        run: chmod +x gradlew

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo usermod -aG kvm $USER
          ls -la /dev/kvm

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p .key
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > .key/app-release.jks
          ls -l .key/app-release.jks
          file .key/app-release.jks

      - name: Generate Baseline Profile via Gradle Managed Device
        run: ./gradlew :baselineprofile:pixel8Api37BenchmarkAndroidTest
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Locate and verify generated profile
        run: |
          echo "=== 1. 搜索 baselineprofile 模块原始产物 ==="
          find baselineprofile/build/outputs -name '*.prof' -o -name 'baseline-prof*' 2>/dev/null | head -20
          echo ""
          echo "=== 2. 搜索 managed_device_benchmark_profiles 目录 ==="
          find baselineprofile/build -type d -name '*benchmark*' 2>/dev/null | head -10
          echo ""
          echo "=== 3. 列出 managed_device_benchmark_profiles 下的所有文件 ==="
          if [ -d baselineprofile/build/outputs/managed_device_benchmark_profiles ]; then
            find baselineprofile/build/outputs/managed_device_benchmark_profiles -type f | head -20
          else
            echo "目录不存在"
          fi
          echo ""
          echo "=== 4. 检查 app 模块合并后的 baseline-prof.txt ==="
          if [ -f app/src/main/baselineProfiles/baseline-prof.txt ]; then
            wc -l app/src/main/baselineProfiles/baseline-prof.txt
            head -5 app/src/main/baselineProfiles/baseline-prof.txt
          else
            echo "app 模块的 baseline-prof.txt 不存在"
          fi

      - name: Manually copy profile if auto-merge failed
        run: |
          # 如果 app 模块的 baseline-prof.txt 不存在或为空，从原始产物手动复制
          if [ ! -s app/src/main/baselineProfiles/baseline-prof.txt ]; then
            echo "app 模块的 baseline-prof.txt 不存在或为空，尝试从原始产物复制..."
            mkdir -p app/src/main/baselineProfiles
            # 搜索所有可能的原始产物路径
            PROF_FILE=$(find baselineprofile/build/outputs -name 'baseline-prof*' -type f | head -1)
            if [ -n "$PROF_FILE" ]; then
              echo "找到原始产物: $PROF_FILE"
              cp "$PROF_FILE" app/src/main/baselineProfiles/baseline-prof.txt
              echo "已复制到 app/src/main/baselineProfiles/baseline-prof.txt"
              wc -l app/src/main/baselineProfiles/baseline-prof.txt
            else
              echo "未找到任何原始产物文件！"
              echo "=== 列出 baselineprofile/build/outputs 下所有文件 ==="
              find baselineprofile/build/outputs -type f 2>/dev/null | head -30
              exit 1
            fi
          else
            echo "app 模块的 baseline-prof.txt 已存在且有内容"
          fi

      - name: Commit and push updated baseline profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/baselineProfiles/baseline-prof.txt
          if git diff --cached --quiet; then
            echo "基线剖析文件无变化，跳过提交"
          else
            git commit -m "chore: regenerate baseline profile [skip ci]"
            git push
          fi
