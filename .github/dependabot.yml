# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # ──────────────────────────────────────────────
  # Android 端：Gradle 依赖（Version Catalog + 各模块 build.gradle.kts）
  # ──────────────────────────────────────────────
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 15
    # 忽略 material3 1.5.0-alpha24+ 的升级（保留 stable 1.5.0 及以后）：
    # alpha27 的 ModalBottomSheet 行为变更（SheetState 构造不再预置动画规格、
    # 新增 isModalBottomSheetStateRestorationFixEnabled 前置条件）导致底部抽屉
    # 弹出动画失效（直接完整展开），且该问题编译可通过、仅运行时可感知，
    # 会被 auto-merge 工作流自动合入。等官方在 stable 版本修复后再解除忽略。
    ignore:
      - dependency-name: "androidx.compose.material3:material3"
        versions: [">=1.5.0-alpha.24", "<1.5.0"]
    # Android 项目根 build.gradle.kts + settings.gradle.kts + libs.versions.toml
    # Dependabot 会自动递归扫描各子模块的 build.gradle.kts
    groups:
      # ── 以下分组顺序很重要：Dependabot 按定义顺序匹配，先匹配到的分组生效 ──
      # 具体分组必须放在 androidx（androidx.*）之前，否则会被 androidx 抢先匹配

      # Compose 相关依赖（必须在 androidx 之前，否则 androidx.compose.* 会被 androidx 匹配）
      compose:
        patterns:
          - "androidx.compose.*"
          - "com.patrykandpatrick.vico"
      # Hilt / 依赖注入（必须在 androidx 之前，否则 androidx.hilt.* 会被 androidx 匹配）
      hilt:
        patterns:
          - "com.google.dagger.*"
          - "androidx.hilt.*"
      # 测试相关依赖（必须在 androidx 之前，否则 androidx.test.* 会被 androidx 匹配）
      testing:
        patterns:
          - "junit"
          - "org.junit.*"
          - "org.robolectric"
          - "com.google.truth"
          - "androidx.test.*"
      # AGP（Android Gradle Plugin）相关插件，统一更新避免版本冲突
      agp:
        patterns:
          - "com.android.application"
          - "com.android.library"
          - "com.android.test"
      # KSP（Kotlin Symbol Processing）插件
      ksp:
        patterns:
          - "com.google.devtools.ksp"
      # Kotlin 相关依赖（kotlin、compose-compiler、serialization 插件）
      kotlin:
        patterns:
          - "org.jetbrains.kotlin.*"
      # KotlinX 库分组
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx.*"
      # AndroidX 依赖统一分组（兜底，放在 compose/hilt/testing 之后确保细分组优先）
      androidx:
        patterns:
          - "androidx.*"
      # Coil 图片加载库分组
      coil:
        patterns:
          - "io.coil-kt.*"
      # 第三方 UI 库分组（backdrop、capsule 等）
      ui-libs:
        patterns:
          - "io.github.kyant0.*"
          - "com.materialkolor"
          - "com.guolindev.permissionx"
          - "com.juul.kable.*"
          - "org.nanohttpd.*"
          - "org.json"
    commit-message:
      prefix: "deps(android)"
      include: "scope"
    labels:
      - "dependencies"
      - "android"
      - "gradle"

  # ──────────────────────────────────────────────
  # Android 端：Gradle Wrapper（gradle-wrapper.properties）
  # ──────────────────────────────────────────────
  # 不需要单独条目！Dependabot 的 gradle ecosystem 默认就会扫描
  # gradle/wrapper/gradle-wrapper.properties，由上面的 gradle 条目统一处理。
  # commit-message prefix 统一使用 "deps(android)" 即可。

  # ──────────────────────────────────────────────
  # GitHub Actions workflows 依赖更新
  # ──────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
