[versions]
agp = "9.3.1"
kotlin = "2.4.10"
ksp = "2.3.11"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
lifecycle = "2.9.1"
activityCompose = "1.13.0"
composeUi = "1.12.0-beta02"
materialIcons = "1.7.8"
material3 = "1.5.0-alpha23"
vico = "3.2.3"
room = "3.0.0"
navigationCompose = "2.9.8"
savedstate = "1.5.0"
fragmentKtx = "1.8.9"
kable = "0.44.3"
permissionx = "1.8.1"
nanohttpd = "2.3.1"
materialKolor = "5.0.0-alpha07"
backdrop = "2.0.0"
capsule = "2.1.3"
work = "2.11.2"
hilt = "2.60.1"
androidxHilt = "1.4.0"
datastore = "1.2.1"
coroutines = "1.8.1"
coil = "3.5.0"
robolectric = "4.13"
truth = "1.4.4"
androidxTestCore = "1.6.1"
benchmark = "1.5.0-beta01"
uiautomator = "2.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "composeUi" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "composeUi" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "composeUi" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "composeUi" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "composeUi" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "composeUi" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "composeUi" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "composeUi" }
androidx-compose-animation-core = { group = "androidx.compose.animation", name = "animation-core", version.ref = "composeUi" }
androidx-compose-material-ripple = { group = "androidx.compose.material", name = "material-ripple", version.ref = "composeUi" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }
# Compose extras
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "materialIcons" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIcons" }
# Room 3 (KMP-ready, androidx.room3 group)
androidx-room-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room" }
# SQLite bundled driver for Room 3 (Android)
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version = "2.7.0" }
# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
# Lifecycle
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
# SavedState
androidx-savedstate = { group = "androidx.savedstate", name = "savedstate", version.ref = "savedstate" }
# Fragment
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
# Kable：Kotlin Asynchronous Bluetooth Low Energy (0.44.x 起使用 kotlin.uuid.Uuid)
kable-core-android = { group = "com.juul.kable", name = "kable-core-android", version.ref = "kable" }
# PermissionX
permissionx = { group = "com.guolindev.permissionx", name = "permissionx", version.ref = "permissionx" }
# NanoHTTPD
nanohttpd = { group = "org.nanohttpd", name = "nanohttpd", version.ref = "nanohttpd" }
nanohttpd-websocket = { group = "org.nanohttpd", name = "nanohttpd-websocket", version.ref = "nanohttpd" }
# MaterialKolor：从 seed 色生成 Material 3 ColorScheme，支持 2025 spec (surfaceBright/Dim 等)
materialkolor = { group = "com.materialkolor", name = "material-kolor", version.ref = "materialKolor" }
# Backdrop (AndroidLiquidGlass)：Compose 液态玻璃效果，blur 需 API 31+，lens 需 API 33+
backdrop = { group = "io.github.kyant0", name = "backdrop", version.ref = "backdrop" }
# Capsule：ContinuousCapsule 连续曲率形状（iOS 风圆角），配合 backdrop 使用
capsule = { group = "io.github.kyant0", name = "capsule", version.ref = "capsule" }
# DataStore Preferences：设置持久化（替代 SharedPreferences），含 SharedPreferencesMigration 迁移器
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# kotlinx-coroutines Android：:core:ui 的 DampedDragAnimation 使用 awaitFrame 等 Android 调度器
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# 单元测试（:data:settings 等模块随迁使用，版本与 :app 既有硬编码声明一致）
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
# Room 3 测试与 sqlite-framework（:data:database 的 AppDatabaseTest 随迁使用，版本与 :app 既有硬编码一致）
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-sqlite-framework = { group = "androidx.sqlite", name = "sqlite-framework", version = "2.7.0" }
# WorkManager：销毁时异步落盘心率记录，避免主线程 runBlocking ANR
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
# Hilt（Dagger 2.60.1 / androidx.hilt 1.4.0，版本经 Maven Central 与 Google Maven metadata 核验，见迁移方案 §4.1）
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHilt" }
hilt-androidx-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }
# Baseline Profile
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
# test-services APK：benchmark 运行依赖，经 androidTestUtil 由 AGP 自动安装到设备
androidx-test-services = { group = "androidx.test.services", name = "test-services", version = "1.6.0" }
# ProfileInstaller：Baseline Profile 运行时安装/启用必需（官方要求 1.3+）
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version = "1.4.1" }

# Coil 3：Compose 图片加载（关于页维护者头像，自带内存/磁盘缓存与生命周期感知）；
# 3.x 网络层拆分，URL 加载需配套 coil-network-okhttp
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
android-test = { id = "com.android.test", version.ref = "agp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
