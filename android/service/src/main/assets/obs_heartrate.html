<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Heart Rate Monitor</title>
<style>
  :root {
    --text-color: #ff3333;
    --bg-color: #000000;
    --border-color: #888888;
    --bg-alpha: 10;
    --border-alpha: 100;
    --font-size: 120px;
    --icon-size-ratio: 0.6;
    --corner-radius: 20;
    --overall-scale: 100;
    --font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    --font-weight: 900;
    --show-unit: none;
    --show-heart: inline;
    --heart-color: #ff3333;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── 心率显示容器 ── */
  #container {
    display: flex;
    align-items: center;
    gap: 0.08em;
    padding: 0.12em 0.2em;
    border-radius: calc(var(--corner-radius) * 1px);
    background: rgba(0,0,0,0);
    border: 1px solid rgba(0,0,0,0);
    transform: scale(calc(var(--overall-scale) / 100));
    transform-origin: center center;
  }

  /* ── 心形 SVG ── */
  #heart-wrap {
    display: var(--show-heart);
    width: calc(var(--font-size) * var(--icon-size-ratio));
    height: calc(var(--font-size) * var(--icon-size-ratio));
    flex-shrink: 0;
    overflow: visible;
  }
  #heart-svg {
    width: 100%; height: 100%;
    overflow: visible;
    filter: drop-shadow(0 0 calc(var(--font-size) * 0.08) rgba(0,0,0,0.5));
  }
  #heart-path {
    fill: var(--heart-color);
    transform-origin: 50% 50%;
    animation: heartbeat 1s ease-in-out infinite;
    vector-effect: non-scaling-stroke;
  }

  @keyframes heartbeat {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  /* ── 心率数值 ── */
  #hr {
    font-family: var(--font-family);
    font-size: var(--font-size);
    font-weight: var(--font-weight);
    color: var(--text-color);
    line-height: 1;
    text-shadow: 0 0 calc(var(--font-size) * 0.15) rgba(0,0,0,0.5);
  }
  #unit {
    font-family: var(--font-family);
    font-size: calc(var(--font-size) * 0.35);
    font-weight: var(--font-weight);
    color: var(--text-color);
    line-height: 1;
    display: var(--show-unit);
    opacity: 0.8;
    text-shadow: 0 0 calc(var(--font-size) * 0.15) rgba(0,0,0,0.5);
    margin-left: 0.05em;
  }

  /* ── 设置面板 ── */
  #settings-toggle {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(40,40,40,0.85);
    color: #fff;
    cursor: pointer;
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.2s;
    backdrop-filter: blur(4px);
    pointer-events: auto;
  }
  #settings-toggle svg {
    width: 20px; height: 20px;
    fill: #fff;
    pointer-events: none;
  }
  #settings-toggle:hover {
    background: rgba(60,60,60,0.95);
    transform: rotate(60deg);
  }

  #settings-panel {
    position: fixed;
    top: 62px;
    right: 12px;
    width: 300px;
    max-height: calc(100vh - 80px);
    overflow-y: auto;
    background: rgba(28,28,32,0.95);
    color: #e0e0e0;
    border-radius: 12px;
    padding: 16px;
    z-index: 9999;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 13px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    display: none;
  }
  #settings-panel.open { display: block; }

  .settings-section {
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .settings-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #aaa;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .control-row:last-child { margin-bottom: 0; }
  .control-label {
    flex: 1;
    font-size: 13px;
    color: #ccc;
  }
  .control-value {
    min-width: 40px;
    text-align: right;
    font-size: 12px;
    color: #888;
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.15);
    outline: none;
    margin: 4px 0 10px 0;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #ff3333;
    cursor: pointer;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #ff3333;
    cursor: pointer;
    border: 2px solid #fff;
  }

  .color-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .color-row label { font-size: 13px; color: #ccc; }
  .color-row input[type="color"] {
    width: 32px; height: 24px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    background: none;
    padding: 0;
  }
  .color-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .color-row input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .toggle-row label { font-size: 13px; color: #ccc; cursor: pointer; }
  .toggle-switch {
    position: relative;
    width: 36px; height: 20px;
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .toggle-switch.on { background: #ff3333; }
  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s;
  }
  .toggle-switch.on::after { transform: translateX(16px); }

  .preset-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .preset-btn {
    flex: 1;
    min-width: 0;
    padding: 6px 4px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    background: rgba(255,255,255,0.05);
    color: #ccc;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .preset-btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.3);
  }

  .reset-btn {
    width: 100%;
    padding: 8px;
    border: 1px solid rgba(255,80,80,0.3);
    border-radius: 6px;
    background: rgba(255,80,80,0.08);
    color: #ff6666;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .reset-btn:hover {
    background: rgba(255,80,80,0.15);
  }

  .lang-select {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    background: rgba(255,255,255,0.05);
    color: #ccc;
    font-size: 12px;
    cursor: pointer;
    outline: none;
  }
  .lang-select option { background: #1c1c20; color: #ccc; }

  /* 连接状态指示器和设置按钮默认显示，body.obs-mode 下隐藏 */
  body.obs-mode #settings-toggle,
  body.obs-mode #status-dot {
    display: none !important;
  }

  #status-dot {
    position: fixed;
    bottom: 8px;
    left: 8px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #666;
    z-index: 1000;
    transition: background 0.3s;
  }
  #status-dot.connected { background: #44ff44; }
  #status-dot.connecting { background: #ffaa00; animation: pulse-status 1s infinite; }
  @keyframes pulse-status { 50% { opacity: 0.3; } }
</style>
</head>

  // ═══════════════════════════════════════════════════
  //  语言检测
  // ═══════════════════════════════════════════════════
  var LANG_STORAGE_KEY = 'obs_hr_lang';

  function detectLang() {
    // 1. URL 参数 ?lang=xx
    var urlLang = params.get('lang');
    if (urlLang && (I18N[urlLang] || urlLang === 'auto')) return urlLang;
    // 2. localStorage
    try {
      var saved = localStorage.getItem(LANG_STORAGE_KEY);
      if (saved && (I18N[saved] || saved === 'auto')) return saved;
    } catch (e) {}
    // 3. 浏览器语言自动匹配
    var bl = (navigator.language || 'en').toLowerCase();
    if (bl.startsWith('zh')) {
      if (bl.includes('tw') || bl.includes('hant')) return 'zh-TW';
      if (bl.includes('hk')) return 'zh-HK';
      return 'zh';
    }
    for (var code in I18N) {
      if (bl.startsWith(code.toLowerCase())) return code;
    }
    return 'en';
  }

  function resolveLang(lang) {
    if (lang === 'auto') {
      var bl = (navigator.language || 'en').toLowerCase();
      if (bl.startsWith('zh')) {
        if (bl.includes('tw') || bl.includes('hant')) return 'zh-TW';
        if (bl.includes('hk')) return 'zh-HK';
        return 'zh';
      }
      for (var code in I18N) {
        if (bl.startsWith(code.toLowerCase())) return code;
      }
      return 'en';
    }
    return lang;
  }

  var currentLang = detectLang();

  function t(key) {
    var lang = resolveLang(currentLang);
    var dict = I18N[lang] || I18N['en'];
    return dict[key] !== undefined ? dict[key] : (I18N['en'][key] !== undefined ? I18N['en'][key] : key);
  }

  function applyI18n() {
    var els = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < els.length; i++) {
      var key = els[i].getAttribute('data-i18n');
      els[i].textContent = t(key);
    }
    // 设置按钮 title 和状态点 title
    document.getElementById('settings-toggle').title = t('settings');
  }

  // 填充语言下拉
  var langSelect = document.getElementById('lang-select');
  for (var i = 0; i < LANG_ORDER.length; i++) {
    var code = LANG_ORDER[i];
    var opt = document.createElement('option');
    opt.value = code;
    opt.textContent = LANG_NAMES[code] || code;
    if (code === currentLang) opt.selected = true;
    langSelect.appendChild(opt);
  }
  langSelect.addEventListener('change', function() {
    currentLang = this.value;
    try { localStorage.setItem(LANG_STORAGE_KEY, currentLang); } catch (e) {}
    applyI18n();
    updateConnectionTitle();
  });

  // ═══════════════════════════════════════════════════
  //  默认值
  // ═══════════════════════════════════════════════════
  var DEFAULTS = {
    textColor:   '#ff3333',
    heartColor:  '#ff3333',
    bgColor:     '#000000',
    borderColor: '#888888',
    bgAlpha:     0,
    borderAlpha: 0,
    overallScale: 120,
    fontSize:    120,
    iconRatio:   120,
    cornerRadius: 20,
    showHeart:   true,
    showUnit:    false,
    syncHeart:   true
  };

  var PRESETS = {
    red:   { textColor: '#ff3333', heartColor: '#ff3333' },
    white: { textColor: '#ffffff', heartColor: '#ffffff' },
    green: { textColor: '#33ff33', heartColor: '#33ff33' },
    blue:  { textColor: '#3399ff', heartColor: '#3399ff' }
  };

  // ═══════════════════════════════════════════════════
  //  设置状态管理
  // ═══════════════════════════════════════════════════
  var STORAGE_KEY = 'obs_hr_settings';

  function loadSettings() {
    var s = {};
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved) s = JSON.parse(saved);
    } catch (e) {}
    if (params.get('color')) s.textColor = params.get('color');
    if (params.get('heartColor')) s.heartColor = params.get('heartColor');
    if (params.get('bg')) s.bgColor = params.get('bg') || '#000000';
    if (params.get('borderColor')) s.borderColor = params.get('borderColor');
    if (params.get('size')) s.fontSize = parseInt(params.get('size')) || DEFAULTS.fontSize;
    if (params.get('iconSize')) s.iconRatio = parseInt(params.get('iconSize')) || DEFAULTS.iconRatio;
    if (params.get('radius')) s.cornerRadius = parseInt(params.get('radius')) || DEFAULTS.cornerRadius;
    if (params.get('scale')) s.overallScale = parseInt(params.get('scale')) || DEFAULTS.overallScale;
    if (params.get('bgAlpha') !== null) s.bgAlpha = parseInt(params.get('bgAlpha')) || 0;
    if (params.get('borderAlpha') !== null) s.borderAlpha = parseInt(params.get('borderAlpha')) || 0;
    if (params.get('unit') === '0' || params.get('unit') === 'false') s.showUnit = false;
    if (params.get('unit') === '1' || params.get('unit') === 'true') s.showUnit = true;
    if (params.get('heart') === '0' || params.get('heart') === 'false') s.showHeart = false;
    if (params.get('heart') === '1' || params.get('heart') === 'true') s.showHeart = true;
    for (var k in DEFAULTS) {
      if (s[k] === undefined) s[k] = DEFAULTS[k];
    }
    return s;
  }

  function saveSettings() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch (e) {}
  }

  var settings = loadSettings();

  // ═══════════════════════════════════════════════════
  //  应用样式
  // ═══════════════════════════════════════════════════
  function hexToRgba(hex, alpha) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    var r = parseInt(hex.substr(0,2), 16);
    var g = parseInt(hex.substr(2,2), 16);
    var b = parseInt(hex.substr(4,2), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + (alpha / 100) + ')';
  }

  function applyStyles() {
    var c = document.getElementById('container');
    root.style.setProperty('--text-color', settings.textColor);
    root.style.setProperty('--heart-color', settings.syncHeart ? settings.textColor : settings.heartColor);
    root.style.setProperty('--bg-color', settings.bgColor);
    root.style.setProperty('--border-color', settings.borderColor);
    root.style.setProperty('--bg-alpha', settings.bgAlpha);
    root.style.setProperty('--border-alpha', settings.borderAlpha);
    root.style.setProperty('--font-size', settings.fontSize + 'px');
    root.style.setProperty('--icon-size-ratio', (settings.iconRatio / 100));
    root.style.setProperty('--corner-radius', settings.cornerRadius);
    root.style.setProperty('--overall-scale', settings.overallScale);
    root.style.setProperty('--show-unit', settings.showUnit ? 'inline' : 'none');
    root.style.setProperty('--show-heart', settings.showHeart ? 'flex' : 'none');
    c.style.background = hexToRgba(settings.bgColor, settings.bgAlpha);
    c.style.borderColor = hexToRgba(settings.borderColor, settings.borderAlpha);
  }

  // ═══════════════════════════════════════════════════
  //  UI 控件绑定
  // ═══════════════════════════════════════════════════
  function updateControlValues() {
    document.getElementById('pick-text').value = settings.textColor;
    document.getElementById('pick-heart').value = settings.heartColor;
    document.getElementById('pick-bg').value = settings.bgColor;
    document.getElementById('pick-border').value = settings.borderColor;
    document.getElementById('slider-bg-alpha').value = settings.bgAlpha;
    document.getElementById('val-bg-alpha').textContent = settings.bgAlpha + '%';
    document.getElementById('slider-border-alpha').value = settings.borderAlpha;
    document.getElementById('val-border-alpha').textContent = settings.borderAlpha + '%';
    document.getElementById('slider-scale').value = settings.overallScale;
    document.getElementById('val-scale').textContent = settings.overallScale + '%';
    document.getElementById('slider-font').value = settings.fontSize;
    document.getElementById('val-font').textContent = settings.fontSize + 'px';
    document.getElementById('slider-icon').value = settings.iconRatio;
    document.getElementById('val-icon').textContent = settings.iconRatio + '%';
    document.getElementById('slider-radius').value = settings.cornerRadius;
    document.getElementById('val-radius').textContent = settings.cornerRadius + 'px';
    document.getElementById('toggle-heart').classList.toggle('on', settings.showHeart);
    document.getElementById('toggle-unit').classList.toggle('on', settings.showUnit);
    document.getElementById('toggle-sync').classList.toggle('on', settings.syncHeart);
  }

  function bindColorPicker(id, key) {
    document.getElementById(id).addEventListener('input', function(e) {
      settings[key] = e.target.value;
      applyStyles(); saveSettings();
    });
  }

  function bindSlider(id, valId, key, suffix) {
    var slider = document.getElementById(id);
    var valEl = document.getElementById(valId);
    slider.addEventListener('input', function(e) {
      var v = parseInt(e.target.value);
      settings[key] = v;
      valEl.textContent = v + suffix;
      applyStyles(); saveSettings();
    });
  }

  function bindToggle(id, key) {
    var el = document.getElementById(id);
    el.addEventListener('click', function() {
      settings[key] = !settings[key];
      el.classList.toggle('on', settings[key]);
      applyStyles(); saveSettings();
    });
  }

  bindColorPicker('pick-text', 'textColor');
  bindColorPicker('pick-heart', 'heartColor');
  bindColorPicker('pick-bg', 'bgColor');
  bindColorPicker('pick-border', 'borderColor');
  bindSlider('slider-bg-alpha', 'val-bg-alpha', 'bgAlpha', '%');
  bindSlider('slider-border-alpha', 'val-border-alpha', 'borderAlpha', '%');
  bindSlider('slider-scale', 'val-scale', 'overallScale', '%');
  bindSlider('slider-font', 'val-font', 'fontSize', 'px');
  bindSlider('slider-icon', 'val-icon', 'iconRatio', '%');
  bindSlider('slider-radius', 'val-radius', 'cornerRadius', 'px');
  bindToggle('toggle-heart', 'showHeart');
  bindToggle('toggle-unit', 'showUnit');
  bindToggle('toggle-sync', 'syncHeart');

  var presetBtns = document.querySelectorAll('.preset-btn');
  for (var i = 0; i < presetBtns.length; i++) {
    presetBtns[i].addEventListener('click', function() {
      var preset = PRESETS[this.dataset.preset];
      if (preset) {
        for (var k in preset) settings[k] = preset[k];
        applyStyles(); updateControlValues(); saveSettings();
      }
    });
  }

  document.getElementById('btn-reset').addEventListener('click', function() {
    settings = {};
    for (var k in DEFAULTS) settings[k] = DEFAULTS[k];
    applyStyles(); updateControlValues(); saveSettings();
  });

  var panel = document.getElementById('settings-panel');
  var toggleBtn = document.getElementById('settings-toggle');
  if (toggleBtn && panel) {
    toggleBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      panel.classList.toggle('open');
    }, true);
    document.addEventListener('click', function(e) {
      if (panel.classList.contains('open') &&
          !panel.contains(e.target) &&
          !toggleBtn.contains(e.target)) {
        panel.classList.remove('open');
      }
    });
  }

  // ═══════════════════════════════════════════════════
  //  心率数据 & 心跳动画
  // ═══════════════════════════════════════════════════
  var hrEl = document.getElementById('hr');
  var heartPath = document.getElementById('heart-path');
  var statusDot = document.getElementById('status-dot');
  var connectionState = '';

  function updateConnectionTitle() {
    statusDot.title = connectionState === 'connected' ? t('connected') :
                      connectionState === 'connecting' ? t('connecting') : t('disconnected');
  }

  function setConnectionState(state) {
    connectionState = state;
    statusDot.className = state;
    updateConnectionTitle();
  }

  function updateHr(hr) {
    if (typeof hr === 'number' && hr > 0) {
      hrEl.textContent = hr.toString();
      var beatDuration = 60 / hr;
      heartPath.style.animationDuration = beatDuration + 's';
    } else {
      hrEl.textContent = '--';
      heartPath.style.animationDuration = '1s';
    }
  }

  // ═══════════════════════════════════════════════════
  //  数据获取
  // ═══════════════════════════════════════════════════
  var config = window.__WS_CONFIG__ || {};
  var wsUrl = params.get('ws') || config.wsUrl || '';
  var token = params.get('token') || config.token || '';

  if (wsUrl) {
    var ws = null;
    var reconnectTimer = null;
    var heartbeatTimer = null;

    function connect() {
      setConnectionState('connecting');
      var url = wsUrl;
      if (token) {
        url += (url.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(token);
      }
      try { ws = new WebSocket(url); }
      catch (e) { setConnectionState(''); scheduleReconnect(); return; }

      ws.onopen = function() {
        setConnectionState('connected');
        heartbeatTimer = setInterval(function() {
          if (ws && ws.readyState === WebSocket.OPEN) {
            try { ws.send('ping'); } catch (e) {}
          }
        }, 10000);
      };
      ws.onmessage = function(event) {
        try { var data = JSON.parse(event.data); updateHr(data.heart_rate); } catch (e) {}
      };
      ws.onclose = function() {
        setConnectionState(''); clearInterval(heartbeatTimer); scheduleReconnect();
      };
      ws.onerror = function() {
        setConnectionState(''); clearInterval(heartbeatTimer);
        try { ws.close(); } catch (e) {}
      };
    }

    function scheduleReconnect() {
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, 3000);
    }
    connect();
  } else {
    var pollUrl = '/heartrate';
    if (token) pollUrl += '?token=' + encodeURIComponent(token);

    function poll() {
      fetch(pollUrl)
        .then(function(r) {
          if (r.ok) { setConnectionState('connected'); return r.json(); }
          throw new Error('HTTP ' + r.status);
        })
        .then(function(data) { updateHr(data.heart_rate); })
        .catch(function() { setConnectionState(''); })
        .finally(function() { setTimeout(poll, 1000); });
    }
    poll();
  }

  // ═══════════════════════════════════════════════════
  //  初始化
  // ═══════════════════════════════════════════════════
  applyI18n();
  applyStyles();
  updateControlValues();
})();
</script>
</body>
</html>
